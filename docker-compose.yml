# ============================================================
# Lynn's Blog 一键部署：MySQL 8 + Spring Boot 后端 + Nginx 前端
# 用法：cp .env.example .env（改密码）→ docker compose up -d --build
# ============================================================
name: lynns-blog

services:
  mysql:
    image: mysql:8.0
    container_name: lynnsblog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置数据库密码}
      MYSQL_DATABASE: personalcenter
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建表并写入默认数据（仅空库时执行）
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build: ./backend
    container_name: lynnsblog-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置数据库密码}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT 密钥}
      TZ: Asia/Shanghai
      # 可选：阿里云 OSS 图片托管（不填则走本地磁盘 uploads 卷）
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_ACCESS_SECRET: ${OSS_ACCESS_SECRET:-}
      OSS_URL_PREFIX: ${OSS_URL_PREFIX:-}
      # 若部署机访问 github.com 处于 MITM 加速代理下，抓取贡献图需放行自签证书：
      # GITHUB_INSECURE_TLS: "true"   （生产公网直连时保持默认 false）
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build: ./frontend
    container_name: lynnsblog-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

volumes:
  mysql-data:
  uploads-data:
